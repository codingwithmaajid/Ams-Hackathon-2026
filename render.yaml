services:
  - type: web
    name: aira-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: AIRA
      - key: APP_VERSION
        value: 0.1.0
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        sync: false
      - key: SNAPSERVE_API_KEY
        sync: false
      - key: SNAPSERVE_BASE_URL
        value: https://app.snapserve.ai/api
      - key: SNAPSERVE_FROM_NUMBER
        sync: false

  - type: web
    name: aira-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SNAPSERVE_AGENT_ID
        value: "825"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
