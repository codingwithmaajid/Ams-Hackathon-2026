services:
  - type: web
    name: jolly-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Jolly
      - key: APP_VERSION
        value: 0.2.0
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        sync: false
      - key: BOLNA_API_KEY
        sync: false
      - key: BOLNA_BASE_URL
        value: https://api.bolna.ai
      - key: BOLNA_AGENT_ID
        sync: false
      - key: BOLNA_FROM_NUMBER
        sync: false
      - key: BOLNA_WEBHOOK_SECRET
        sync: false

  - type: web
    name: jolly-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_BOLNA_AGENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
